name: Build social preview image
on:
  push:
    branches: [master]
    paths:
      - "assets/og-montair.svg"
      - ".github/workflows/social-preview.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate PNG Open Graph image
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url="assets/og-montair.svg",write_to="assets/og-montair.png",output_width=1200,output_height=630)
          PY
      - name: Publish image file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og-montair.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate social preview PNG"
            git push
          fi
